name: Build loft receiver release
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  pi-plan:
    runs-on: ubuntu-24.04
    outputs:
      source: ${{ steps.plan.outputs.source }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SOURCE=$(bash scripts/pi-image-plan.sh)
          echo "source=$SOURCE" >> "$GITHUB_OUTPUT"
          echo "Pi image source: $SOURCE" >> "$GITHUB_STEP_SUMMARY"
  hub:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y shellcheck jq
      - run: bash sources/sdr-hub/deploy/loft/build.sh
      - run: bash scripts/test.sh
      - name: Package container without requiring registry authentication
        run: |
          mkdir -p dist
          docker save loft/sdr-hub:local | gzip -1 > dist/hub-image.tar.gz
          python3 scripts/image_archive.py dist/hub-image.tar.gz > dist/hub-image.txt
      - uses: actions/upload-artifact@v4
        with:
          name: hub-image
          path: |
            dist/hub-image.txt
            dist/hub-image.tar.gz
  pi:
    needs: pi-plan
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - if: needs.pi-plan.outputs.source == 'build'
        run: sudo apt-get update && sudo apt-get install -y parted e2fsprogs xz-utils
      - if: needs.pi-plan.outputs.source == 'build'
        run: sudo bash pi/build.sh
      - name: Reuse verified Pi image
        if: needs.pi-plan.outputs.source != 'build'
        env:
          GH_TOKEN: ${{ github.token }}
          PI_RELEASE: ${{ needs.pi-plan.outputs.source }}
        run: |
          mkdir -p dist
          gh release download "$PI_RELEASE" --repo "$GITHUB_REPOSITORY" \
            --pattern loft-pi.img.xz --pattern SHA256SUMS --dir dist
          cd dist
          awk '$2 == "loft-pi.img.xz" { print }' SHA256SUMS > PI-SHA256SUMS
          test "$(wc -l < PI-SHA256SUMS)" -eq 1
          sha256sum --check --strict PI-SHA256SUMS
          rm SHA256SUMS PI-SHA256SUMS
          echo "Reused verified Pi image from $PI_RELEASE" >> "$GITHUB_STEP_SUMMARY"
      - run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$GITHUB_REF_TYPE" != tag ]]; then TAG=$(cat sources/adsb-feeder-image/release-version); fi
          sudo python3 scripts/catalogue.py "$TAG"
      - uses: actions/upload-artifact@v4
        with:
          name: pi-image
          path: |
            dist/loft-pi.img.xz
            dist/pi-imager.json
  release:
    needs: [hub, pi]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: bash scripts/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: dist/*
      - name: Publish prerelease
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --prerelease \
            --title "Loft SDR $GITHUB_REF_NAME" \
            --notes "Built receiver image and SDR Hub container. Physical Pi boot, Wi-Fi/DAB reception and Proxmox host installation still require hardware verification. See README for setup."
